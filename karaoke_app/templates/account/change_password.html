{% extends "base.html" %}
{% block title %}Đổi mật khẩu{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white">
        <i class="bi bi-key me-2"></i>Đổi mật khẩu
      </div>
      <div class="card-body">
        <p class="text-muted small mb-3">
          Tài khoản: <strong>{{ user.get_display_name }}</strong>
          <span class="badge bg-secondary ms-1">{{ user.get_role_display }}</span>
        </p>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Mật khẩu hiện tại</label>
            <input type="password" name="old_password" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Mật khẩu mới</label>
            <input type="password" name="new_password" class="form-control" required
              minlength="6" placeholder="Ít nhất 6 ký tự">
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Xác nhận mật khẩu mới</label>
            <input type="password" name="confirm_password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-check-circle me-2"></i>Đổi mật khẩu
          </button>
        </form>
      </div>
      <div class="card-footer text-center">
        <a href="{% url 'dashboard' %}" class="text-muted small">
          <i class="bi bi-arrow-left me-1"></i>Quay lại
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
