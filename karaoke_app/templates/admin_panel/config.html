{% extends "base.html" %}
{% block title %}Cấu hình hệ thống{% endblock %}

{% block content %}
<h4 class="fw-bold mb-4"><i class="bi bi-gear me-2"></i>Cấu hình hệ thống</h4>

<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <form method="post">
      {% csrf_token %}

      <div class="card mb-3">
        <div class="card-header bg-dark text-white"><i class="bi bi-printer me-2"></i>Máy in nhiệt (ESC/POS)</div>
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label fw-semibold">Địa chỉ IP máy in</label>
            <input type="text" name="printer_ip" class="form-control" value="{{ configs.printer_ip }}"
              placeholder="VD: 192.168.1.100">
            <div class="form-text">Kết nối qua mạng LAN/WiFi (Network TCP)</div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Port</label>
            <input type="number" name="printer_port" class="form-control" value="{{ configs.printer_port }}"
              placeholder="9100">
            <div class="form-text">Thường là 9100 (mặc định ESC/POS)</div>
          </div>
        </div>
      </div>

      <div class="card mb-3">
        <div class="card-header bg-dark text-white"><i class="bi bi-shop me-2"></i>Thông tin cửa hàng</div>
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label fw-semibold">Tên cửa hàng</label>
            <input type="text" name="shop_name" class="form-control" value="{{ configs.shop_name }}">
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-save me-2"></i>Lưu cấu hình
      </button>
    </form>
  </div>
</div>
{% endblock %}
