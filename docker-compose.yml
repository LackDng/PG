version: "3.9"

services:
  karaoke:
    build: .
    container_name: karaoke_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Lưu database và static files ra ngoài container (dữ liệu bền vững)
      - karaoke_db:/data/db
      - karaoke_static:/data/static
    environment:
      # Tài khoản admin lần đầu (thay đổi theo ý bạn)
      DJANGO_ADMIN_USERNAME: admin
      DJANGO_ADMIN_PASSWORD: admin123
      # Cấu hình Django
      DJANGO_SECRET_KEY: "change-this-to-a-long-random-string-in-production"
      DJANGO_DEBUG: "false"
      TZ: Asia/Ho_Chi_Minh

volumes:
  karaoke_db:
  karaoke_static:
